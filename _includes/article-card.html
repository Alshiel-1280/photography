{% assign article = include.article %}
<article class="article-card">
    <a class="article-card__image" href="{{ article.url | relative_url }}">
        <img src="{{ article.hero_image | relative_url }}" alt="{{ article.hero_alt | default: article.title | escape }}" loading="lazy" decoding="async" />
    </a>
    <div class="article-card__body">
        <div class="article-meta">
            <span>{{ article.category | default: '撮影ガイド' }}</span>
            <time datetime="{{ article.date | date_to_xmlschema }}">{{ article.date | date: "%Y.%m.%d" }}</time>
        </div>
        <h3><a href="{{ article.url | relative_url }}">{{ article.title }}</a></h3>
        <p>{{ article.description }}</p>
        <a class="text-link" href="{{ article.url | relative_url }}">記事を読む</a>
    </div>
</article>
