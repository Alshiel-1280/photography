  hero_image: /images/fulls/P1044114.jpg
  description: 大阪で、仕事・SNS・宣材に使いやすいプロフィール写真を撮影します。用途に合わせて背景、服装、構図を事前に整理します。
  lead: プロフィール写真は、見た目の印象だけでなく、掲載先で必要な縦横比や余白も重要です。Webサイト、SNS、登壇資料、オーディションなどの用途を確認し、使いやすいカットを撮影します。
  suitable_for:
    - Webサイトや名刺に載せるビジネスプロフィール
    - SNS、講師、クリエイター活動用の写真
    - 宣材、オーディション、出演者紹介用の写真
  details:
    - title: 撮影場所
      text: 大阪市内の屋外、オフィス、レンタルスタジオなど。掲載媒体と求める印象に合わせて背景を相談します。
    - title: 料金
      text: 撮影時間、撮影場所、必要なパターン数、利用範囲を確認後に個別見積もりします。スタジオ代などの実費は事前にお伝えします。
    - title: 納品
      text: 用途に合うカットをセレクトし、明るさや色、肌の見え方を整えてオンライン納品します。枚数と納期は事前に合意します。
  process:
    - title: 用途確認
      text: 掲載先、希望する印象、必要な縦横比、使用開始日を確認します。
    - title: 撮影準備
      text: 場所、服装、背景、持参物、費用を整理して日程を確定します。
    - title: 撮影
      text: 表情、姿勢、顔の向き、余白を変えながら複数パターンを撮影します。
    - title: 納品
      text: 掲載先で選びやすい状態に整え、合意した方法と期日でお渡しします。
  faqs:
    - question: 屋外とスタジオのどちらが向いていますか？
      answer: 親しみや自然さを出したい場合は屋外、背景を揃えたい場合や天候に左右されたくない場合はスタジオが向いています。用途を見て相談します。
    - question: 服装を変えて撮影できますか？
      answer: 撮影時間と場所に応じて対応します。必要なパターン数を相談時にお知らせください。
    - question: WebサイトとSNSの両方に使えますか？
      answer: はい。必要な縦横比やトリミング余白を事前に確認し、複数の掲載先で使いやすい構図を撮影します。
