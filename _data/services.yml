    - 兵庫県
  hero_image: /images/fulls/Z62_8731.jpg
  description: 関西のスタジオやイベントで、衣装・キャラクター・ロケーションの世界観を大切にしたコスプレ撮影を受け付けています。
  lead: キャラクターの資料、再現したい場面、必要な構図を事前に共有し、会場ルールと撮影可能時間の中で優先順位を決めます。ストロボや定常光を使う場合も、施設やイベントの規約を確認して進めます。
  suitable_for:
    - イベントでの記録と作品撮り
    - スタジオで照明を組んだキャラクター撮影
    - 複数人や併せでの構図を決めた撮影
  details:
    - title: 撮影場所
      text: 関西のコスプレイベント、レンタルスタジオ、撮影許可を得たロケーション。会場規約や機材制限を事前に確認します。
    - title: 料金
      text: 参加形態、撮影時間、人数、場所、必要機材を確認後に個別見積もりします。参加費、スタジオ代、交通費などの実費は事前に整理します。
    - title: 納品
      text: 作品の雰囲気に合わせて色と明るさを整え、オンラインで納品します。特殊な合成や大幅な修整は内容を確認して別途相談します。
  process:
    - title: 資料共有
      text: キャラクター、衣装、参考画像、撮りたい構図、会場情報を共有してください。
    - title: 優先順位
      text: 撮影可能時間とルールを確認し、必ず撮りたいカットから順番を決めます。
    - title: 撮影
      text: 衣装や造形が見える角度、表情、照明を確認しながら進めます。
    - title: 納品
      text: セレクトとレタッチ後、掲載予定に間に合うよう合意した期日でお渡しします。
  faqs:
    - question: イベントでの撮影を依頼できますか？
      answer: 可能です。チケット、撮影者登録、機材制限、撮影可能エリアなどの主催者ルールを事前に確認します。
    - question: ストロボ撮影はできますか？
      answer: 会場やスタジオの規約で使用可能な場合に対応します。混雑状況や安全を優先し、使用できない場合は自然光や会場光で撮影します。
    - question: 複数人の併せも依頼できますか？
      answer: 可能です。人数、撮影時間、必要な構図を確認し、全員の個人カットと集合カットの優先順位を事前に整理します。
