  lead: 街歩き、公園、海辺、スタジオなど、撮りたい雰囲気と写真の用途を伺いながら撮影場所と時間帯を組み立てます。撮影に慣れていない方も、立ち位置や視線を相談しながら進められます。
  suitable_for:
    - SNSや個人活動で使う写真
    - 記念日や旅行に合わせたロケーション撮影
    - 作品づくりやモデル活動用のポートレート
  details:
    - title: 撮影場所
      text: 大阪・京都・神戸・奈良などの屋外ロケーション、レンタルスタジオ。施設の撮影許可や入場料が必要な場合は事前に確認します。
    - title: 料金
      text: 撮影時間、場所、必要なカット数を確認後に個別見積もりします。交通費、施設利用料、スタジオ代が発生する場合は事前にお伝えします。
    - title: 納品
      text: オンラインでデータを納品します。納品枚数、レタッチ範囲、納期は依頼内容を確認したうえで合意します。
  process:
    - title: 相談
      text: 希望日、場所、用途、撮りたい雰囲気、予算感を送ってください。
    - title: 内容確認
      text: 撮影場所、時間、費用、掲載可否などを確認し、合意後に日程を確定します。
    - title: 撮影
      text: 当日は仕上がりを確認しながら、表情やポーズを相談して進めます。
    - title: 納品
      text: セレクトとレタッチ後、合意した方法と期日でデータをお渡しします。
  faqs:
    - question: 撮影に慣れていなくても依頼できますか？
      answer: はい。希望する雰囲気を確認し、立ち位置や視線、動き方を相談しながら撮影します。
    - question: 雨天時はどうなりますか？
      answer: 屋外撮影は天気予報と撮影目的を見ながら、延期、屋内への変更、雨を活かした撮影を相談します。
    - question: 撮影した写真をSNSで使えますか？
      answer: 利用目的を事前に確認します。商用利用、広告利用、大幅な加工を予定している場合は相談時にお知らせください。
